[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "serena-agent"
version = "99.0.0"
description = "Retired. Minimal stub MCP server."
readme = "README.md"
requires-python = ">=3.11, <3.15"
dependencies = []

[project.scripts]
serena = "serena.cli:main"
serena-agent = "serena.cli:main"
serena-hooks = "serena.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/serena"]

[tool.hatch.build.targets.sdist]
include = ["src/serena", "README.md", "pyproject.toml"]
